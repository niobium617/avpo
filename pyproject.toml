[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avpo"
version = "0.1.0"
description = "AI 视频工作流操作系统 —— 连接剧本、AI 生成模型与剪映的智能中间层"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "edge-tts==7.2.8",
    "openai==3.2.0",
    "typer==0.27.1",
    "mutagen==1.48.1",
    "pyJianYingDraft==0.3.0",
    "python-dotenv==1.2.3",
    "streamlit==1.62.0",
    "miniaudio==1.71",
    "numpy==2.5.2",
    "faster-whisper==1.2.1",
    "opencc-python-reimplemented==0.1.7",
]

[project.scripts]
avpo = "app.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "playwright==1.62.0",   # 生成 docs/screenshots/ 工作台截图（tools/screenshot_workbench.py）
]

[tool.setuptools]
packages = ["app", "app.audio", "app.core", "app.director", "app.tts", "app.vision", "app.timeline", "app.export", "app.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: 真实外部 API 测试（edge-tts / SiliconFlow），需要 .env 密钥与网络，默认跳过；用 pytest -m live 显式运行",
]
